name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # یہ ایکشن خودکار طریقے سے بالکل صحیح Gradle ڈاؤن لوڈ کر لے گا 
    # اور آپ کی کرپٹڈ wrapper فائل کو مکمل بائی پاس کر دے گا
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 9.3.1

    - name: Generate dummy debug keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    # اب یہاں ہم ./gradlew کی بجائے ڈائریکٹ gradle کمانڈ استعمال کر رہے ہیں
    - name: Build Debug APK
      run: gradle assembleDebug

    - name: Upload all APKs
      uses: actions/upload-artifact@v4
      with:
        name: Anu-Battle-APK
        path: '**/*.apk'
